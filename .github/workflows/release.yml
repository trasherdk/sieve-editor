name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run build
          pnpm exec electron-builder --${{ matrix.target }} --publish always
  notes:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No GitHub release for $TAG. electron-builder did not publish."
            exit 1
          fi
          COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
            echo "Release $TAG has no assets. electron-builder did not publish binaries."
            exit 1
          fi
          node scripts/changelog.mjs "$TAG" "$TAG" > notes.md
          gh release edit "$TAG" --title "Sieve Editor $TAG" --notes-file notes.md --draft=false
